name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Generate placeholder icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path public
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap(512, 512)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(99, 102, 241))
          $font = New-Object System.Drawing.Font("Arial", 200, [System.Drawing.FontStyle]::Bold)
          $brush = [System.Drawing.Brushes]::White
          $sf = New-Object System.Drawing.StringFormat
          $sf.Alignment = [System.Drawing.StringAlignment]::Center
          $sf.LineAlignment = [System.Drawing.StringAlignment]::Center
          $rect = New-Object System.Drawing.RectangleF(0, 0, 512, 512)
          $g.DrawString("N", $font, $brush, $rect, $sf)
          $g.Dispose()
          $bmp.Save("public/icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()

      - name: Build Electron installer
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: notebook-windows-installer
          path: release/*.exe
          retention-days: 30
